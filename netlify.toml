[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The Netlify address forwards to the real domain, so there is one address for members, sign-ins and QR codes.
[[redirects]]
  from = "https://graas-portal.netlify.app/*"
  to = "https://graas.org.in/:splat"
  status = 301
  force = true
